name: Update README with fresh stats

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README.md with cache-busting timestamp
        run: |
          TIMESTAMP=$(date +%s)
          sed -i 's/cache_bust=[0-9]*/cache_bust='"$TIMESTAMP"'/' README.md

      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}
          
          # DEBUG: Show remote URL to confirm PAT is being used
          echo "Remote URL: $(git config --get remote.origin.url)"
          
          git add README.md
          git diff --cached --quiet || git commit -m "Update README with fresh stats"
          git push origin HEAD:master

